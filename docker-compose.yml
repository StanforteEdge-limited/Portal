services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stanforte}
      POSTGRES_USER: ${POSTGRES_USER:-stanforte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stanforte-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stanforte} -d ${POSTGRES_DB:-stanforte}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - portal-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - portal-mailpit:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stanforte}:${POSTGRES_PASSWORD:-stanforte-dev}@postgres:5432/${POSTGRES_DB:-stanforte}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CACHE_TTL_SECONDS: "300"
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-D06BB4071445202E0C4557CDF9A1CD41729F84EA3CFDEB4C81F8B613DE9B9B82}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-62A6E88613570318A90FF88EC92BECB5F3D39A4A6D933CFC263D2177D9F2C8C1}
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8025
      APP_BASE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      FILE_BASE_URL: http://localhost:3000
      EMAIL_NOTIFICATIONS_ENABLED: "true"
      MAIL_FROM: no-reply@stanforteedge.com
      MAIL_SUPPORT_EMAIL: support@stanforteedge.com
      MAIL_MESSAGE_ID_DOMAIN: stanforteedge.com
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-586B9AB2AAB9A0F8BB77E18F3A1E33156031AC69B8C38819FA5DD1523C65372B}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_SECURE: "false"
      PDF_BROWSER_PATH: /usr/bin/chromium-browser
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_SSL: ${DB_SSL:-false}
      RATE_LIMIT_REDIS_PREFIX: ${RATE_LIMIT_REDIS_PREFIX:-rl:}
      GLOBAL_RATE_LIMIT_WINDOW_MS: ${GLOBAL_RATE_LIMIT_WINDOW_MS:-60000}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-600}
      AUTH_ROLE_CACHE_TTL_MS: ${AUTH_ROLE_CACHE_TTL_MS:-30000}
      AUTH_ROLE_CACHE_MAX_ENTRIES: ${AUTH_ROLE_CACHE_MAX_ENTRIES:-100000}
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
      FILE_UPLOAD_MAX_MB: "10"
      REALTIME_ENABLED: "true"
      PRESENCE_ENABLED: "true"
      NOTIFICATION_WORKER_ENABLED: "true"
      NOTIFICATION_SCHEDULER_ENABLED: "true"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    init: true
    environment:
      VITE_API_BASE_URL: http://localhost:3000/v1
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/shared/src:/app/apps/shared/src:ro

volumes:
  portal-postgres:
  portal-redis:
  portal-mailpit: