name: Development CI

on:
  push:
    branches: [development]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/desktop/**"
      - "apps/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-development.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @stanforte/contract build

      - name: Generate Drizzle Client
        run: pnpm --filter portal-api-fastify drizzle:generate

      - name: Run API Unit Tests
        run: pnpm --filter portal-api-fastify test:unit

      - name: Build Web PWA
        run: pnpm run build:pwa2

      - name: Build Desktop Frontend
        run: pnpm run build:desktop

      - name: Build API
        run: pnpm run build:api
