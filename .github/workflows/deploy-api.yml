name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter portal-api prisma:generate

      - name: Build API
        run: pnpm run build:api

      - name: Run server deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.API_SSH_USER }}
          key: ${{ secrets.API_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.API_APP_DIR }}"
            pwd
            ls -la
            ls -la .git
            git fetch origin
            git checkout main
            git pull origin main
            export DATABASE_URL="$(grep '^DATABASE_URL=' apps/api/.env | cut -d= -f2-)"
            pnpm install --frozen-lockfile
            pnpm run deploy:server
            node apps/api/scripts/seed-rbac.js
            pnpm --filter portal-api seed:release-baseline
            pm2 startOrReload apps/api/ecosystem.config.cjs --env production